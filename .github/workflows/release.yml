name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate release version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          test "$RELEASE_TAG" = "v$version" || { echo 'Tag must match Cargo.toml version'; exit 1; }
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target "$TARGET" --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test installer
        run: python3 scripts/test_installer.py
      - name: Build and package
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/terminapp" --version
          mkdir -p dist package
          cp "target/$TARGET/release/terminapp" package/terminapp
          cp README.md package/
          tar -czf "dist/terminapp-$TARGET.tar.gz" -C package terminapp README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminapp-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: terminapp-*
          path: dist
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        run: |
          cd dist
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          cp ../install.sh .
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Release is already published'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS install.sh --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
